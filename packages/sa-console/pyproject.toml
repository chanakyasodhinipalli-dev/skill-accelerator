[project]
name = "sa-console"
version = "0.1.0"
description = "Operator console: a browser UI for forms, artifacts, providers, and the platform"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  "sa-platform",
  "sa-forms",
  "sa-connectors",
  "sa-api",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[project.scripts]
sa-console = "sa_console.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_console"]

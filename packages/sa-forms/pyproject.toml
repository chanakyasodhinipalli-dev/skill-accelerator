[project]
name = "sa-forms"
version = "0.1.0"
description = "Conversational form intake: gather form data from chat, JIRA, and email threads; render, review, and baseline artifacts"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  "sa-platform",
  "sa-skills",
  "sa-tools",
  "sa-connectors",
  "sa-orchestrator",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Renderers degrade gracefully: any format whose library is absent is simply
# reported as unavailable rather than failing at import time.
xlsx = ["openpyxl>=3.1"]
pdf = ["fpdf2>=2.7"]
docx = ["python-docx>=1.1"]
all = ["openpyxl>=3.1", "fpdf2>=2.7", "python-docx>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_forms"]

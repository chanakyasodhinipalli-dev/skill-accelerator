[project]
name = "sa-connectors"
version = "0.1.0"
description = "Outbound integrations: resilient HTTP, OpenAPI tool generation, MCP servers, and LLM providers"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  "sa-platform",
  "sa-tools",
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# The official Anthropic SDK. Required for the LLM provider.
anthropic = ["anthropic>=0.69"]
# Model Context Protocol client (stdio + streamable HTTP transports).
mcp = ["mcp>=1.2"]
all = ["anthropic>=0.69", "mcp>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_connectors"]

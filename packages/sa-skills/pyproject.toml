[project]
name = "sa-skills"
version = "0.1.0"
description = "Reusable skill contracts, registry, discovery, and guarded runtime"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  "sa-platform",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
validation = ["jsonschema>=4.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_skills"]

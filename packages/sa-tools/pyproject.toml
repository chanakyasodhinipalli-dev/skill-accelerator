[project]
name = "sa-tools"
version = "0.1.0"
description = "Tool abstraction, registry, policy enforcement, and guarded executor"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  "sa-platform",
  "sa-skills",
  "pydantic>=2.7",
]

[project.optional-dependencies]
http = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_tools"]

[project]
name = "sa-orchestrator"
version = "0.1.0"
description = "DAG workflow engine coordinating skills, tools, connectors, and LLM steps"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  "sa-platform",
  "sa-skills",
  "sa-tools",
  "sa-connectors",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_orchestrator"]

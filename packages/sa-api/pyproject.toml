[project]
name = "sa-api"
version = "0.1.0"
description = "FastAPI service exposing skills, tools, workflows, and connectors"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  "sa-platform",
  "sa-skills",
  "sa-tools",
  "sa-connectors",
  "sa-orchestrator",
  "sa-forms",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_api"]

[project]
name = "sa-platform"
version = "0.1.0"
description = "Cross-cutting platform foundation: config, context, errors, logging, telemetry, resilience, registry, security"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_platform"]

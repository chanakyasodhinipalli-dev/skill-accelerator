name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Keep CI deterministic and offline: no discovery of installed skill
  # packages, and text logs that are readable in the run output.
  SA_LOGGING__FORMAT: text
  SA_LOGGING__LEVEL: WARNING

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install workspace
        run: make install

      - name: Ruff
        run: python -m ruff check packages skills tests examples

      - name: Ruff format check
        run: python -m ruff format --check packages skills tests examples

      - name: Mypy
        run: python -m mypy packages/*/src
        continue-on-error: true  # advisory until annotations are complete

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install workspace
        run: make install

      - name: Tests
        run: python -m pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  contracts:
    name: Skill contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install workspace
        run: make install

      # Every registered skill must satisfy the platform contract: a usable
      # description, a declared input schema, an owner if stable, and no
      # retries on a non-idempotent skill.
      - name: Verify skill contracts
        run: python -m sa_cli.main skills verify

      - name: Verify wiring
        run: python -m sa_cli.main doctor

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: skill-accelerator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name sa -p 8000:8000 \
            -e SA_ENVIRONMENT=dev skill-accelerator:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready > /dev/null; then
              echo "ready"; exit 0
            fi
            sleep 2
          done
          echo "container did not become ready"; docker logs sa; exit 1
